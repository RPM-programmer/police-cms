<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ГАИ — Государственная автомобильная инспекция</title>
    <link rel="stylesheet" href="/police-cms/css/general/general.css" />

    <main class="container">
      <section class="dept-hero">
        <h1 id="dept-title" style="font-size: 30px; margin-bottom: 8px">ГАИ</h1>

          style="margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap"

          id="dept-links"

    <footer class="site-footer">
